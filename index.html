<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erik Mende | Portfolio</title>
    <meta
      name="description"
      content="Software Developer — React, TypeScript, C#, .NET"
    />
    <script>
      // Restore the original path when redirected from GitHub Pages 404 fallback.
      (function () {
        const redirect = window.location.search.match(/\?\/(.*)/);
        if (!redirect) return;

        const rewritten = redirect[1]
          .replace(/~and~/g, '&')
          .split('&')
          .join('?');
        const cleanPath =
          window.location.pathname + rewritten + window.location.hash;

        window.history.replaceState(null, '', cleanPath);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
