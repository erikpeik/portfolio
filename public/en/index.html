<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var l = window.location;
        var qs = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        var target = l.protocol + '//' + l.host + '/?/' + 'en' + qs + l.hash;

        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
