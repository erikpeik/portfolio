        "sameAs": [
          "https://github.com/erikpeik",
          "https://www.linkedin.com/in/erikpeik/"
        ]
      }
    </script>

    <!-- Restore the original path when redirected from GitHub Pages 404 fallback. -->
    <script>
      (function () {
        const redirect = window.location.search.match(/\?\/(.*)/);
        if (!redirect) return;

        const rewritten = redirect[1]
          .replace(/~and~/g, '&')
          .split('&')
          .join('?');
        const cleanPath =
          window.location.pathname + rewritten + window.location.hash;

        window.history.replaceState(null, '', cleanPath);
      })();
    </script>
